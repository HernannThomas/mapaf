version: '3.8'

services:
  # Microservicio 1: Telemetria y Sensores
  telemetry-service:
    build:
      context: .
      dockerfile: services/telemetry_service/Dockerfile
    container_name: scada_telemetry_service
    ports:
      - "8001:8001"
    environment:
      - TELEMETRY_PORT=8001
      - SCADA_HOST=0.0.0.0
    restart: unless-stopped

  # Microservicio 2: Contabilidad y Balance Fiscal
  production-service:
    build:
      context: .
      dockerfile: services/production_service/Dockerfile
    container_name: scada_production_service
    ports:
      - "8002:8002"
    environment:
      - PRODUCTION_PORT=8002
      - SCADA_HOST=0.0.0.0
    restart: unless-stopped

  # Microservicio 3: Alertas y Alarmas ISA 18.2
  alerts-service:
    build:
      context: .
      dockerfile: services/alerts_service/Dockerfile
    container_name: scada_alerts_service
    ports:
      - "8003:8003"
    environment:
      - ALERTS_PORT=8003
      - SCADA_HOST=0.0.0.0
    restart: unless-stopped

  # Microservicio 4: Equipos y Topologia de Planta
  assets-service:
    build:
      context: .
      dockerfile: services/assets_service/Dockerfile
    container_name: scada_assets_service
    ports:
      - "8004:8004"
    environment:
      - ASSETS_PORT=8004
      - SCADA_HOST=0.0.0.0
    restart: unless-stopped

  # Microservicio 5: API Gateway y Dashboard HMI
  gateway-service:
    build:
      context: .
      dockerfile: services/gateway_service/Dockerfile
    container_name: scada_gateway_service
    ports:
      - "8000:8000"
    environment:
      - GATEWAY_PORT=8000
      - SCADA_HOST=0.0.0.0
      - SERVICE_HOST=gateway-service
    depends_on:
      - telemetry-service
      - production-service
      - alerts-service
      - assets-service
    restart: unless-stopped
